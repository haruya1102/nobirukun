<!doctype html>

<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-fixed": "#ffdcc0",
              "error-container": "#ffdad6",
              "inverse-primary": "#98d695",
              "surface-dim": "#e9d7c5",
              "inverse-on-surface": "#ffeede",
              "on-secondary": "#ffffff",
              "surface-bright": "#fff8f4",
              "surface-container-high": "#f8e5d3",
              "secondary-container": "#f9dbb7",
              "on-primary-container": "#0c4918",
              "surface-container-low": "#fff1e6",
              "inverse-surface": "#392e23",
              "on-primary-fixed": "#002105",
              "surface-tint": "#326a35",
              "surface-variant": "#f2dfce",
              "on-tertiary-fixed": "#2d1600",
              "primary-fixed-dim": "#98d695",
              "on-tertiary-container": "#5f3400",
              "on-secondary-container": "#755f42",
              "surface-container-lowest": "#ffffff",
              "on-primary": "#ffffff",
              background: "#fef9f0",
              "outline-variant": "#c1c9bc",
              "surface-container-highest": "#f2dfce",
              "on-secondary-fixed-variant": "#574329",
              "on-error-container": "#93000a",
              secondary: "#705b3e",
              "primary-container": "#7cb87a",
              "primary-fixed": "#b3f2af",
              "on-secondary-fixed": "#281903",
              "on-surface-variant": "#41493f",
              surface: "#fff8f4",
              "secondary-fixed-dim": "#dfc29f",
              "secondary-fixed": "#fcdeba",
              "on-error": "#ffffff",
              error: "#ba1a1a",
              "on-background": "#231a0f",
              outline: "#71796e",
              "tertiary-fixed-dim": "#ffb875",
              "tertiary-container": "#de9b5b",
              "on-surface": "#231a0f",
              tertiary: "#875218",
              "surface-container": "#feebd9",
              "on-tertiary": "#ffffff",
              "on-primary-fixed-variant": "#18511f",
              primary: "#326a35",
              "on-tertiary-fixed-variant": "#6b3b00",
            },
            fontFamily: {
              headline: ["Plus Jakarta Sans"],
              body: ["Be Vietnam Pro"],
              label: ["Plus Jakarta Sans"],
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "2rem",
              xl: "3rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        display: inline-block;
        line-height: 1;
      }
      body {
        background-color: #fef9f0;
        color: #231a0f;
      }
      .step-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .glass-card {
        background: rgba(255, 248, 244, 0.6);
        backdrop-filter: blur(8px);
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="font-body min-h-screen flex flex-col items-center">
    <!-- Top Navigation Anchor -->
    <header
      class="w-full sticky top-0 z-50 flex items-center justify-between px-6 py-4 bg-[#fff8f4] dark:bg-stone-950"
    >
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[#326a35]">close</span>
      </div>
      <h1 class="font-headline font-bold text-lg tracking-tight text-[#326a35]">
        家事のきろく
      </h1>
      <div class="w-6"></div>
      <!-- Spacer for centering -->
    </header>
    <main class="w-full max-w-md px-6 pt-8 pb-32 flex flex-col items-center">
      <!-- Step Indicator -->
      <div class="flex gap-3 mb-10">
        <div class="step-dot bg-[#326a35]"></div>
        <div class="step-dot bg-[#326a35]"></div>
        <div class="step-dot bg-[#f2dfce]"></div>
      </div>
      <!-- Question Section -->
      <div class="mb-10 text-center">
        <h2
          class="font-headline font-extrabold text-2xl text-[#231a0f] leading-relaxed"
        >
          きょうのりょうり、<br />うまくできた？🍳
        </h2>
      </div>
      <!-- Rating List (Asymmetric Layout inspired) -->
      <div class="w-full space-y-4">
        <!-- Rating 1 -->
        <button
          class="w-full flex items-center p-5 bg-[#fff1e6] hover:bg-[#f2dfce] transition-all duration-300 rounded-xl text-left"
        >
          <span class="text-3xl mr-4">😢</span>
          <div class="flex flex-col">
            <span class="font-headline font-bold text-[#705b3e]"
              >1 — あんまりうまくいかなかった…</span
            >
          </div>
        </button>
        <!-- Rating 2 -->
        <button
          class="w-full flex items-center p-5 bg-[#fff1e6] hover:bg-[#f2dfce] transition-all duration-300 rounded-xl text-left"
        >
          <span class="text-3xl mr-4">😐</span>
          <div class="flex flex-col">
            <span class="font-headline font-bold text-[#705b3e]"
              >2 — まあまあだったかな</span
            >
          </div>
        </button>
        <!-- Rating 3 -->
        <button
          class="w-full flex items-center p-5 bg-[#fff1e6] hover:bg-[#f2dfce] transition-all duration-300 rounded-xl text-left"
        >
          <span class="text-3xl mr-4">🙂</span>
          <div class="flex flex-col">
            <span class="font-headline font-bold text-[#705b3e]"
              >3 — ふつうにできたよ</span
            >
          </div>
        </button>
        <!-- Rating 4 (ACTIVE STATE) -->
        <button
          class="w-full flex items-center p-5 bg-[#7cb87a]/20 border-2 border-[#326a35] scale-[1.02] rounded-xl text-left shadow-lg shadow-[#326a35]/10"
        >
          <span class="text-3xl mr-4">😊</span>
          <div class="flex flex-col">
            <span class="font-headline font-bold text-[#0c4918]"
              >4 — よくできたと思う！</span
            >
          </div>
          <div class="ml-auto">
            <span
              class="material-symbols-outlined text-[#326a35]"
              style="font-variation-settings: &quot;FILL&quot; 1"
              >check_circle</span
            >
          </div>
        </button>
        <!-- Rating 5 -->
        <button
          class="w-full flex items-center p-5 bg-[#fff1e6] hover:bg-[#f2dfce] transition-all duration-300 rounded-xl text-left"
        >
          <span class="text-3xl mr-4">🤩</span>
          <div class="flex flex-col">
            <span class="font-headline font-bold text-[#705b3e]"
              >5 — かんぺきだった！！</span
            >
          </div>
        </button>
      </div>
    </main>
    <!-- Bottom Action Area -->
    <div
      class="fixed bottom-0 left-0 w-full px-6 pb-10 pt-6 bg-gradient-to-t from-[#fef9f0] via-[#fef9f0]/95 to-transparent flex flex-col items-center"
    >
      <button
        class="w-full max-w-xs bg-[#326a35] text-white font-headline font-bold py-5 px-8 rounded-xl shadow-xl shadow-[#326a35]/20 hover:scale-105 active:scale-95 transition-all flex items-center justify-center gap-2"
      >
        <span>きろくする</span>
        <span class="material-symbols-outlined text-xl">check</span>
      </button>
    </div>
    <!-- Hidden Bottom Nav for top-level pages only (Not shown here per rules but defined in anchors) -->
  </body>
</html>
