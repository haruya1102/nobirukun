<!doctype html>

<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-fixed": "#ffdcc0",
              "error-container": "#ffdad6",
              "inverse-primary": "#98d695",
              "surface-dim": "#e9d7c5",
              "inverse-on-surface": "#ffeede",
              "on-secondary": "#ffffff",
              "surface-bright": "#fff8f4",
              "surface-container-high": "#f8e5d3",
              "secondary-container": "#f9dbb7",
              "on-primary-container": "#0c4918",
              "surface-container-low": "#fff1e6",
              "inverse-surface": "#392e23",
              "on-primary-fixed": "#002105",
              "surface-tint": "#326a35",
              "surface-variant": "#f2dfce",
              "on-tertiary-fixed": "#2d1600",
              "primary-fixed-dim": "#98d695",
              "on-tertiary-container": "#5f3400",
              "on-secondary-container": "#755f42",
              "surface-container-lowest": "#ffffff",
              "on-primary": "#ffffff",
              background: "#fff8f4",
              "outline-variant": "#c1c9bc",
              "surface-container-highest": "#f2dfce",
              "on-secondary-fixed-variant": "#574329",
              "on-error-container": "#93000a",
              secondary: "#705b3e",
              "primary-container": "#7cb87a",
              "primary-fixed": "#b3f2af",
              "on-secondary-fixed": "#281903",
              "on-surface-variant": "#41493f",
              surface: "#fff8f4",
              "secondary-fixed-dim": "#dfc29f",
              "secondary-fixed": "#fcdeba",
              "on-error": "#ffffff",
              error: "#ba1a1a",
              "on-background": "#231a0f",
              outline: "#71796e",
              "tertiary-fixed-dim": "#ffb875",
              "tertiary-container": "#de9b5b",
              "on-surface": "#231a0f",
              tertiary: "#875218",
              "surface-container": "#feebd9",
              "on-tertiary": "#ffffff",
              "on-primary-fixed-variant": "#18511f",
              primary: "#326a35",
              "on-tertiary-fixed-variant": "#6b3b00",
            },
            fontFamily: {
              headline: ["Plus Jakarta Sans"],
              body: ["Be Vietnam Pro"],
              label: ["Plus Jakarta Sans"],
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "2rem",
              xl: "3rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .organic-bg {
        background-image:
          radial-gradient(
            circle at 10% 20%,
            rgba(124, 184, 122, 0.05) 0%,
            transparent 20%
          ),
          radial-gradient(
            circle at 90% 80%,
            rgba(222, 155, 91, 0.05) 0%,
            transparent 20%
          );
      }
      .bloom-shadow {
        box-shadow: 0 20px 40px -12px rgba(124, 184, 122, 0.3);
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-surface text-on-surface font-body organic-bg min-h-screen flex flex-col"
  >
    <!-- TopAppBar (Suppressed navigation for focused journey) -->
    <header
      class="w-full sticky top-0 z-50 flex items-center justify-between px-6 py-4 w-full bg-[#fff8f4] no-border tonal-shift"
    >
      <div class="flex items-center gap-4">
        <span class="material-symbols-outlined text-[#326a35] cursor-pointer"
          >close</span
        >
      </div>
      <h1
        class="font-['Plus_Jakarta_Sans'] font-bold text-lg tracking-tight text-[#326a35]"
      >
        家事のきろく
      </h1>
      <div class="w-6"></div>
      <!-- Spacer for centering -->
    </header>
    <main
      class="flex-1 flex flex-col items-center justify-center px-6 py-12 gap-12 max-w-md mx-auto w-full"
    >
      <!-- Step Indicators -->
      <div class="flex gap-3 items-center">
        <div class="w-2.5 h-2.5 rounded-full bg-primary-container"></div>
        <div class="w-2.5 h-2.5 rounded-full bg-primary-container"></div>
        <div
          class="w-2.5 h-2.5 rounded-full bg-primary-container ring-4 ring-primary/20"
        ></div>
      </div>
      <!-- Central Growth Visual -->
      <div
        class="relative w-full flex flex-col items-center justify-center py-8"
      >
        <div class="flex items-center gap-6 md:gap-10">
          <div
            class="w-24 h-24 md:w-32 md:h-32 bg-surface-container-low rounded-xl flex items-center justify-center text-5xl md:text-6xl transform -rotate-6"
          >
            🌿
          </div>
          <div class="flex items-center justify-center">
            <span
              class="material-symbols-outlined text-primary-container text-4xl font-bold"
              >trending_flat</span
            >
          </div>
          <div
            class="w-32 h-32 md:w-44 md:h-44 bg-primary-container rounded-xl flex items-center justify-center text-7xl md:text-8xl transform rotate-6 bloom-shadow"
          >
            🌸
          </div>
        </div>
        <!-- Confetti/Petal abstract elements -->
        <div
          class="absolute -top-4 -left-4 w-8 h-8 rounded-full bg-tertiary-fixed opacity-40"
        ></div>
        <div
          class="absolute top-1/4 -right-8 w-12 h-12 rounded-full bg-primary-fixed opacity-30"
        ></div>
        <div
          class="absolute -bottom-6 left-1/4 w-6 h-6 rounded-full bg-secondary-container opacity-50"
        ></div>
      </div>
      <!-- Text Content -->
      <div class="text-center space-y-4">
        <h2
          class="font-headline font-extrabold text-3xl text-primary tracking-tight leading-tight"
        >
          ニワノコがそだちました！
        </h2>
        <!-- Stage Info Badge -->
        <div
          class="inline-flex items-center px-6 py-2 bg-surface-container rounded-full shadow-[0_12px_30px_-10px_rgba(61,50,38,0.08)] border border-white/50"
        >
          <span class="font-headline font-bold text-secondary">Stage 2</span>
          <span class="material-symbols-outlined mx-2 text-secondary text-sm"
            >arrow_forward</span
          >
          <span class="font-headline font-bold text-primary">Stage 3 🎉</span>
        </div>
      </div>
      <!-- Summary Card (Bento Style) -->
      <div
        class="w-full bg-surface-container-low p-6 rounded-xl flex flex-col gap-4 border border-white/20"
      >
        <div class="flex items-center gap-4">
          <div class="p-3 bg-white rounded-lg shadow-sm">
            <span class="material-symbols-outlined text-tertiary">star</span>
          </div>
          <div class="flex-1">
            <p class="text-sm text-on-surface-variant font-medium">
              獲得したしあわせ
            </p>
            <p class="font-headline font-bold text-xl text-on-surface">
              +120 pts
            </p>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <div class="p-3 bg-white rounded-lg shadow-sm">
            <span class="material-symbols-outlined text-primary"
              >local_florist</span
            >
          </div>
          <div class="flex-1">
            <p class="text-sm text-on-surface-variant font-medium">
              おにわの状態
            </p>
            <p class="font-headline font-bold text-xl text-on-surface">
              はなやか
            </p>
          </div>
        </div>
      </div>
      <!-- Action Button -->
      <div class="w-full pt-4">
        <button
          class="w-full bg-primary py-5 px-8 rounded-xl text-white font-headline font-bold text-lg flex items-center justify-center gap-3 shadow-lg hover:scale-[1.02] active:scale-95 transition-all duration-300"
        >
          <span>にわにもどる</span>
          <span class="text-2xl">🏡</span>
        </button>
      </div>
    </main>
    <!-- Bottom Navigation (Suppressed for transactional journey, but shell preserved if needed) -->
    <!-- Navigation is suppressed here to prioritize the content canvas as per "Destination Rule" -->
    <!-- Decorative Bottom Wave (Animal Crossing Vibe) -->
    <div
      class="h-24 w-full bg-primary-container relative overflow-hidden mt-auto"
      style="clip-path: ellipse(100% 100% at 50% 100%)"
    >
      <div
        class="absolute inset-0 opacity-20 pointer-events-none"
        style="
          background-image: radial-gradient(#ffffff 2px, transparent 2px);
          background-size: 24px 24px;
        "
      ></div>
    </div>
  </body>
</html>
