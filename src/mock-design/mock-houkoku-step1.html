<!doctype html>

<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-fixed": "#ffdcc0",
              "error-container": "#ffdad6",
              "inverse-primary": "#98d695",
              "surface-dim": "#e9d7c5",
              "inverse-on-surface": "#ffeede",
              "on-secondary": "#ffffff",
              "surface-bright": "#fff8f4",
              "surface-container-high": "#f8e5d3",
              "secondary-container": "#f9dbb7",
              "on-primary-container": "#0c4918",
              "surface-container-low": "#fff1e6",
              "inverse-surface": "#392e23",
              "on-primary-fixed": "#002105",
              "surface-tint": "#326a35",
              "surface-variant": "#f2dfce",
              "on-tertiary-fixed": "#2d1600",
              "primary-fixed-dim": "#98d695",
              "on-tertiary-container": "#5f3400",
              "on-secondary-container": "#755f42",
              "surface-container-lowest": "#ffffff",
              "on-primary": "#ffffff",
              background: "#fff8f4",
              "outline-variant": "#c1c9bc",
              "surface-container-highest": "#f2dfce",
              "on-secondary-fixed-variant": "#574329",
              "on-error-container": "#93000a",
              secondary: "#705b3e",
              "primary-container": "#7cb87a",
              "primary-fixed": "#b3f2af",
              "on-secondary-fixed": "#281903",
              "on-surface-variant": "#41493f",
              surface: "#fff8f4",
              "secondary-fixed-dim": "#dfc29f",
              "secondary-fixed": "#fcdeba",
              "on-error": "#ffffff",
              error: "#ba1a1a",
              "on-background": "#231a0f",
              outline: "#71796e",
              "tertiary-fixed-dim": "#ffb875",
              "tertiary-container": "#de9b5b",
              "on-surface": "#231a0f",
              tertiary: "#875218",
              "surface-container": "#feebd9",
              "on-tertiary": "#ffffff",
              "on-primary-fixed-variant": "#18511f",
              primary: "#326a35",
              "on-tertiary-fixed-variant": "#6b3b00",
            },
            fontFamily: {
              headline: ["Plus Jakarta Sans"],
              body: ["Be Vietnam Pro"],
              label: ["Plus Jakarta Sans"],
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "2rem",
              xl: "3rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      body {
        background-color: #fff8f4; /* Matches surface token but fixed for specific branding */
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="font-body text-on-background min-h-screen flex flex-col">
    <!-- Top Navigation Shell -->
    <header
      class="w-full sticky top-0 z-50 flex items-center justify-between px-6 py-4 w-full bg-[#fff8f4] dark:bg-stone-950 no-border tonal-shift"
    >
      <div class="flex items-center gap-4">
        <span
          class="material-symbols-outlined text-[#326a35] dark:text-[#7cb87a] cursor-pointer hover:bg-[#fff1e6] transition-colors duration-300 p-2 rounded-full"
          >close</span
        >
      </div>
      <h1
        class="font-['Plus_Jakarta_Sans'] font-bold text-lg tracking-tight text-[#326a35] dark:text-[#7cb87a]"
      >
        家事のきろく
      </h1>
      <div class="w-10"></div>
      <!-- Spacer for balance -->
    </header>
    <main class="flex-1 max-w-md mx-auto w-full px-6 py-8 flex flex-col">
      <!-- Step Indicator -->
      <div class="flex justify-center items-center space-x-3 mb-10">
        <div
          class="w-4 h-4 rounded-full bg-primary shadow-sm shadow-primary/20"
        ></div>
        <div
          class="w-4 h-4 rounded-full border-2 border-primary/40 bg-transparent"
        ></div>
        <div
          class="w-4 h-4 rounded-full border-2 border-primary/40 bg-transparent"
        ></div>
      </div>
      <!-- Headline Area -->
      <div class="mb-10 text-center">
        <h2
          class="font-headline font-extrabold text-3xl text-primary tracking-tight mb-2"
        >
          きょうのおしごとは？
        </h2>
        <p class="text-on-surface-variant font-medium opacity-80">
          やった家事を選んでね
        </p>
      </div>
      <!-- Asymmetric/Bento-style 2x2 Grid -->
      <div class="grid grid-cols-2 gap-5 mb-12">
        <!-- Card 1: Cleaning -->
        <button
          class="flex flex-col items-center justify-center aspect-square bg-surface-container-low rounded-xl shadow-[0_12px_30px_-10px_rgba(61,50,38,0.08)] hover:scale-105 transition-all duration-300 ease-out group"
        >
          <div
            class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4 shadow-sm group-hover:rotate-12 transition-transform"
          >
            <span class="text-4xl">🧹</span>
          </div>
          <span class="font-headline font-bold text-lg text-secondary"
            >そうじ</span
          >
        </button>
        <!-- Card 2: Cooking (Selected State) -->
        <button
          class="flex flex-col items-center justify-center aspect-square bg-primary-fixed rounded-xl border-4 border-primary shadow-[0_12px_30px_-10px_rgba(61,50,38,0.08)] scale-105 relative overflow-hidden transition-all duration-300"
        >
          <div class="absolute top-2 right-2">
            <span
              class="material-symbols-outlined text-primary text-2xl"
              style="font-variation-settings: &quot;FILL&quot; 1"
              >check_circle</span
            >
          </div>
          <div
            class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4 shadow-sm"
          >
            <span class="text-4xl">🍳</span>
          </div>
          <span
            class="font-headline font-bold text-lg text-on-primary-container"
            >りょうり</span
          >
        </button>
        <!-- Card 3: Laundry -->
        <button
          class="flex flex-col items-center justify-center aspect-square bg-surface-container-low rounded-xl shadow-[0_12px_30px_-10px_rgba(61,50,38,0.08)] hover:scale-105 transition-all duration-300 ease-out group"
        >
          <div
            class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4 shadow-sm group-hover:-rotate-12 transition-transform"
          >
            <span class="text-4xl">👕</span>
          </div>
          <span class="font-headline font-bold text-lg text-secondary"
            >せんたく</span
          >
        </button>
        <!-- Card 4: Other -->
        <button
          class="flex flex-col items-center justify-center aspect-square bg-surface-container-low rounded-xl shadow-[0_12px_30px_-10px_rgba(61,50,38,0.08)] hover:scale-105 transition-all duration-300 ease-out group"
        >
          <div
            class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4 shadow-sm group-hover:scale-110 transition-transform"
          >
            <span class="text-4xl">✨</span>
          </div>
          <span class="font-headline font-bold text-lg text-secondary"
            >そのほか</span
          >
        </button>
      </div>
      <!-- Decorative Illustration Placeholder -->
      <div class="mt-auto mb-8 flex justify-center opacity-60">
        <img
          alt="A small green sprout in soft garden style"
          class="h-20 object-contain"
          data-alt="Soft watercolor illustration of a cute green sprout"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuDhg_BSs3vMIgV62wrim1bgWwvc3qvT1rmW4EhzerJQhO7zPbdB8cZ-Ejha51ff92ST7A7Jozy-wIKJGRjVXh2xmofyd8x7AhKpX9PKIAddiG9uLAv4H6MIahZQB32el25r9zjv3-Y2jsz-mBgJWLjDny9jkGYlcHfyr0St-BmBXA9od5agGJdnP5SPCDEN8qCLx_GFhmSY8gGyPp4rzsINzhlynpDoWRuzrEUnobbVZCr-T5aRz_ylSAj-_Wa6BZDCnD2HjhR2768"
        />
      </div>
      <!-- Primary Action Button -->
      <button
        class="w-full bg-primary text-white font-headline font-bold text-xl py-5 rounded-xl shadow-[0_20px_40px_-12px_rgba(50,106,53,0.3)] hover:scale-[1.02] active:scale-95 transition-all duration-300 flex items-center justify-center gap-2 group"
      >
        つぎへ
        <span
          class="material-symbols-outlined group-hover:translate-x-1 transition-transform"
          >arrow_forward</span
        >
      </button>
    </main>
    <!-- Navigation Shell Placeholder (Not visible on task-focused screens as per mandate, but included for structure if context shifts) -->
    <div class="h-12"></div>
    <!-- Hidden Bottom Nav logic as it is a transactional step -->
    <nav
      class="hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 bg-[#fff8f4]/80 backdrop-blur-md shadow-lg rounded-t-[3rem]"
    >
      <div
        class="flex flex-col items-center justify-center text-[#705b3e] opacity-60 px-5 py-2"
      >
        <span class="material-symbols-outlined">home</span>
        <span
          class="font-['Be_Vietnam_Pro'] text-[10px] font-medium tracking-wide"
          >ホーム</span
        >
      </div>
      <div
        class="flex flex-col items-center justify-center bg-[#7cb87a] text-white rounded-full px-5 py-2 scale-105 transition-all"
      >
        <span
          class="material-symbols-outlined"
          style="font-variation-settings: &quot;FILL&quot; 1"
          >edit_note</span
        >
        <span
          class="font-['Be_Vietnam_Pro'] text-[10px] font-medium tracking-wide"
          >きろく</span
        >
      </div>
      <div
        class="flex flex-col items-center justify-center text-[#705b3e] opacity-60 px-5 py-2"
      >
        <span class="material-symbols-outlined">local_florist</span>
        <span
          class="font-['Be_Vietnam_Pro'] text-[10px] font-medium tracking-wide"
          >ずかん</span
        >
      </div>
      <div
        class="flex flex-col items-center justify-center text-[#705b3e] opacity-60 px-5 py-2"
      >
        <span class="material-symbols-outlined">settings</span>
        <span
          class="font-['Be_Vietnam_Pro'] text-[10px] font-medium tracking-wide"
          >設定</span
        >
      </div>
    </nav>
  </body>
</html>
